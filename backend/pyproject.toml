[project]
name = "personal_ai_backend"
version = "0.1.0"
description = "Local-first GenAI workbench - Day 1 foundation and PDF ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
