services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-workbench_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
